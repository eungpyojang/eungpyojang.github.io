<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% if page.title %}{{ page.title }} — {% endif %}Eungpyo Jang</title>
  <meta name="description" content="{{ page.description | default: site.description }}" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}">Eungpyo <span>Jang.</span></a>
    <nav class="nav" aria-label="Main navigation">
      <a class="{% if page.nav == 'home' %}active{% endif %}" href="{{ '/' | relative_url }}">Home</a>
      <a class="{% if page.nav == 'research' %}active{% endif %}" href="{{ '/research/' | relative_url }}">Research</a>
      <a class="{% if page.nav == 'publications' %}active{% endif %}" href="{{ '/publications/' | relative_url }}">Publications</a>
      <a class="{% if page.nav == 'activities' %}active{% endif %}" href="{{ '/activities/' | relative_url }}">Activities</a>
      <a class="cv-nav {% if page.nav == 'cv' %}active{% endif %}" href="{{ '/curriculum-vitae/' | relative_url }}">CV</a>
    </nav>
    <div class="nav-social" aria-label="External links">
      <a href="https://www.instagram.com/yes_pyo/" target="_blank" rel="noreferrer" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
      <a href="https://www.youtube.com/@ecomoneyna" target="_blank" rel="noreferrer" aria-label="YouTube"><i class="fa-brands fa-youtube"></i></a>
      <a href="https://blog.naver.com/yes_explorer" target="_blank" rel="noreferrer" aria-label="Blog"><i class="fa-solid fa-pen-nib"></i></a>
      <a href="https://github.com/eungpyojang" target="_blank" rel="noreferrer" aria-label="GitHub"><i class="fa-brands fa-github"></i></a>
      <a href="mailto:yes_explorer@naver.com" aria-label="Email"><i class="fa-solid fa-envelope"></i></a>
    </div>
  </header>

  <main>{{ content }}</main>

  <footer class="site-footer shell">
    <div>
      <strong>Eungpyo Jang</strong>
      <span>Environmental Health · EcoHealth</span>
    </div>
    <div class="footer-links">
      <a href="mailto:yes_explorer@naver.com">Email</a>
      <a href="https://github.com/eungpyojang" target="_blank" rel="noreferrer">GitHub</a>
      <a href="#top">Back to top ↑</a>
    </div>
  </footer>
</body>
</html>
